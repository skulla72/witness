<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Witness</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #0b1729;
        color: #faf8f3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 2rem;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; letter-spacing: 0.02em; }
      p { margin: 0 0 1.5rem; opacity: 0.75; line-height: 1.5; }
      button {
        background: #c9a227; color: #0b1729; border: 0; border-radius: 999px;
        padding: 0.85rem 1.75rem; font-size: 1rem; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Witness is offline</h1>
      <p>You are not connected right now. Anything you were writing is saved on this phone and will send when you are back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
