# Manual builds only: no Git triggers. Only witness-ios-testflight uploads.
# iPhone signing files are fetched automatically through the Apple integration.
workflows:
  witness-ios-processing-check:
    name: Witness iPhone — read-only Apple processing check
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: "Witness Codemagic Edge"
    environment:
      vars:
        WITNESS_IOS_BUILD_NUMBER: "1020"
    scripts:
      - name: Read uploaded build processing and TestFlight state
        script: |
          set -euo pipefail
          python3 scripts/apple-processing-check.py
    artifacts:
      - build-native/apple-processing.json
  witness-ios-check:
    name: Witness iPhone — compile check, simulator only
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install locked dependencies with Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s -- bun-v1.3.6
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Compile the iPhone app without store signing
        script: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bunx --no-install cap sync ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-native/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
          ditto -c -k --sequesterRsrc --keepParent \
            build-native/ios-simulator/Build/Products/Debug-iphonesimulator/App.app \
            build-native/Witness-iOS-simulator.zip
    artifacts:
      - build-native/Witness-iOS-simulator.zip
  witness-ios:
    name: Witness iPhone — signed build, no upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Witness Codemagic Edge"
    inputs:
      build_number:
        description: iOS build number (1–9999); use a higher number for every new Apple upload.
        type: number
        default: 1
    environment:
      node: 22
      xcode: latest
      groups:
        - witness_ios_signing
    scripts:
      - name: Install locked dependencies with Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s -- bun-v1.3.6
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Build and export the signed iPhone app
        script: |
          set -euo pipefail
          bash scripts/codemagic-ios.sh "${{ inputs.build_number }}"
    artifacts:
      - build-native/ios/ipa/*.ipa
      - build-native/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
  witness-ios-testflight:
    name: Witness iPhone — TestFlight upload, no public release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Witness Codemagic Edge"
    inputs:
      prepare_signing:
        description: One-time missing certificate/profile setup using the existing protected key (0=no, 1=yes).
        type: number
        default: 0
    environment:
      node: 22
      xcode: latest
      groups:
        - witness_ios_signing
      vars:
        # Separate from the old build-1 workflow. Apple rejects duplicates.
        WITNESS_IOS_BUILD_NUMBER: "1020"
    scripts:
      - name: Verify Apple access before signing setup
        script: |
          set -euo pipefail
          python3 scripts/apple-release-preflight.py
      - name: Reuse signing assets and optionally prepare missing assets
        script: |
          set -euo pipefail
          prepare="${{ inputs.prepare_signing }}"
          case "$prepare" in
            0) extra=() ;;
            1) extra=(--create) ;;
            *) echo "prepare_signing must be 0 or 1." >&2; exit 2 ;;
          esac
          # Preflight has established that the exact bundle already exists.
          # Reuse the protected key; create only missing matching signing assets.
          # Never generate API/private keys or delete/revoke existing resources.
          test -n "${CERTIFICATE_PRIVATE_KEY:-}"
          app-store-connect fetch-signing-files com.commonlight.witness \
            --type IOS_APP_STORE --strict-match-identifier "${extra[@]}"
      - name: Install locked dependencies with Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s -- bun-v1.3.6
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Build and export with existing signing identity
        script: |
          set -euo pipefail
          bash scripts/codemagic-ios.sh "$WITNESS_IOS_BUILD_NUMBER"
    artifacts:
      - build-native/ios/ipa/*.ipa
      - build-native/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal TestFlight setup; do not request external beta
        # review, assign/invite testers, expire builds or submit publicly.
        submit_to_testflight: false
        submit_to_app_store: false
  witness-android:
    name: Witness Android — signed build, no upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    inputs:
      build_number:
        description: Google Play version code; use a higher whole number for every new upload.
        type: number
        default: 1
    environment:
      node: 22
      java: 21
      groups:
        - witness_android_signing
    scripts:
      - name: Install locked dependencies with Bun
        script: |
          set -euo pipefail
          curl -fsSL https://bun.com/install | bash -s -- bun-v1.3.6
          "$HOME/.bun/bin/bun" install --frozen-lockfile
      - name: Install the Android build SDK
        script: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            echo "Android SDK manager is missing at the configured SDK location." >&2
            exit 1
          fi
          "$sdk_manager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;36.0.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' \
            "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$CM_ENV"
      - name: Build and verify the signed Android app
        script: |
          set -euo pipefail
          bash scripts/codemagic-android.sh "${{ inputs.build_number }}"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/reports/lint-results-release.*
